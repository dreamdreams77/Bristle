<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bristle and the Unfolding Map</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1d0;--ink:#3a2548;--card:#fffaf0;--honey:#f6b73c;--rose:#e2557a;--line:#e8c98a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1228;--ink:#fbe9c6;--card:#2e1c3f;--line:#5a3f78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1228;--ink:#fbe9c6;--card:#2e1c3f;--line:#5a3f78;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#hud{display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap;font-weight:700;font-size:15px}
#hud h1{font-size:17px;margin:0;margin-right:auto}
.bar{width:90px;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--honey),var(--rose));transition:width .3s}
.folds{display:flex;gap:4px}
.folds b{width:16px;height:16px;border-radius:3px;border:2px solid var(--line);transform:skewX(-8deg);transition:all .4s}
.folds b.on{background:var(--honey);border-color:var(--honey);transform:skewX(0) rotate(6deg)}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;touch-action:none}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:20px;font-weight:700;border:2px solid var(--honey);opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;max-width:90%}
#toast.show{opacity:1}
#tm{position:absolute;top:10px;right:12px;font-weight:700;background:var(--card);color:var(--ink);border-radius:12px;padding:4px 10px;border:2px solid var(--line)}#tm:empty{display:none}button:disabled{opacity:.5;cursor:default}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(29,18,40,.55);padding:16px}
#ov.hide{display:none}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:22px 24px;max-width:430px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);border:3px solid var(--honey);max-height:100%;overflow:auto}
.card h2{margin:0 0 6px;font-size:26px;line-height:1.1}
.card p{margin:6px 0;line-height:1.35;font-weight:500}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 8px;cursor:pointer}
button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.paths button small{display:block;font-weight:500;font-size:12px;opacity:.8}
.paths button.sel{background:var(--honey);border-color:var(--honey);color:#3a2548}
#go{width:100%;background:var(--rose);border-color:var(--rose);color:#fff;font-size:18px;padding:12px}
#touch{display:none;position:absolute;left:0;right:0;bottom:10px;padding:0 14px;justify-content:space-between;pointer-events:none}
#touch div{display:flex;gap:10px}
#touch button{pointer-events:auto;width:66px;height:66px;border-radius:50%;font-size:22px;opacity:.82;touch-action:none}
@media (pointer:coarse){#touch{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 X.save();X.font="700 16px 'Trebuchet MS',sans-serif";X.textAlign='center';
 L.forEach(on=>{if(!on)return;const p=trAt(time-(.4+n*.24)),cs=CS[n];if(cs){const x=p[0]-cs.sx*(10+n*14),y=p[1]+P.h-48-(1-Math.min(1,cheerT))*12+Math.sin(t*9+n)*3;X.globalAlpha=Math.min(1,cheerT);X.fillStyle=n%2?'#ff7fae':'#ffd54a';X.strokeStyle='rgba(40,20,60,.7)';X.lineWidth=3;const g=n%2?'♥':'♪';X.strokeText(g,x,y);X.fillText(g,x,y)}n++});X.restore()};

/* region title cards */

{const st=document.createElement('style');st.textContent=`#rt{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;z-index:3;color:#fff7e0;text-shadow:0 2px 0 #3a2548,0 0 22px rgba(0,0,0,.5)}

function regionCard(zi){RT.innerHTML='<small>Fold '+(zi+1)+' of 13</small><b>'+Z[zi].n+'</b><i>'+FLAV[zi]+'</i>';RT.classList.remove('go');void RT.offsetWidth;RT.classList.add('go');foldT=1}
function foldFx(){if(foldT<=0||RM)return;const n=8,w=C.width/n,e=foldT*foldT,a=.5*e;X.save();X.setTransform(1,0,0,1,0,0);
 for(let i=0;i<n;i++){const x=i*w,d=i%2,g=X.createLinearGradient(x,0,x+w,0);g.addColorStop(0,d?'rgba(30,15,50,'+a+')':'rgba(255,245,220,'+a+')');g.addColorStop(1,d?'rgba(255,245,220,'+a*.6+')':'rgba(30,15,50,'+a*.6+')');X.fillStyle=g;X.fillRect(x,0,w+1,C.height);X.fillStyle='rgba(255,255,255,'+.5*e+')';X.fillRect(x,0,2,C.height)}X.restore()}

/* extra hand-tuned hazards */
function findSpot2(zi,u,w,noLane){const z=Z[zi];for(let d=0;d<1400;d+=20)for(const sg of[1,-1]){const x=Math.round(z.a+(z.b-z.a)*u+sg*d);
 if(x>z.a+60&&x<z.b-60&&gAt(x-w*.6)&&gAt(x+w*.6)&&!inR(x,BADZ)&&!(noLane&&inR(x,LANES))&&ST.every(s=>Math.abs(s.x-x)>110)&&HZ.every(h=>Math.abs(h.x-x)>h.w/2+w+30)&&GT.every(g=>Math.abs(g.x-x)>w+90)&&GU.every(g=>Math.abs(g.x-x)>w+120)&&MU.every(m=>Math.abs(m.x-x)>w*.6+15))return x}return null}

[[4,.2],[5,.45],[10,.62],[2,.9]].forEach(([zi,u])=>{const x=findSpot2(zi,u,60,1);if(x!==null){GU.push({x,zi});[110,215,320].forEach(y=>ORB.push({x:x+(y==215?10:-6),y:GY-y,t:0}))}});

/* ===== v7: prop sway, wet-floor reflections, marsh water, Tidal Deep caustics and surface shimmer ===== */
function sway(name,amp){const f=window[name];if(typeof f!='function')return;
 window[name]=function(x,h,...r){if(Q>=2||RM)return f.call(this,x,h,...r);const T=performance.now()/1000,w=Math.sin(T*1.1+x*.004)+Math.sin(T*.31+x*.0011)*.8,d=x-P.x,push=Math.abs(d)<80?(d>0?1:-1)*(1-Math.abs(d)/80)*1.6:0,k=-(w*amp+push*amp*1.5);
  X.save();X.translate(x,GY);X.transform(1,0,k,1,0,0);X.translate(-x,-GY);const o=f.call(this,x,h,...r);X.restore();return o}}
[['tree',.014],['lolli',.03],['reed',.05],['cloudTree',.02],['dreamProp',.03],['fungProp',.018],['frostProp',.008],['tidalProp',.06]].forEach(a=>sway(a[0],a[1]));

const RFL=mk(128,128),rf=RFL.getContext('2d');
function curSprite(){const mv=Math.abs(P.vx)>25&&P.g;return A[P.glide?'char_bristle_glide':!P.g?'char_bristle_jump':'char_bristle_run_'+(mv?Math.floor(P.step*.6)%4:0)]}
function wetFloor(t){const zi=zIdx(P.x);if((zi!=4&&zi!=12)||Q>=2)return;let gy=null;for(const q of SOL)if(q[3]&&P.x>q[0]&&P.x<q[0]+q[2]&&q[1]>=P.y+P.h-4&&(gy===null||q[1]<gy))gy=q[1];if(gy===null)return;
 const h=gy-(P.y+P.h);if(h>150)return;rf.globalCompositeOperation='source-over';rf.clearRect(0,0,128,128);rf.save();rf.translate(64,12+h+15);rf.scale(bFs<0?-1:1,-1);rf.drawImage(curSprite(),-48,-38,96,80);rf.restore();
 rf.globalCompositeOperation='destination-in';const gr=rf.createLinearGradient(0,0,0,100);gr.addColorStop(0,'rgba(0,0,0,.75)');gr.addColorStop(1,'rgba(0,0,0,0)');rf.fillStyle=gr;rf.fillRect(0,0,128,128);
 X.save();for(let i=0;i<14;i++){const y0=i*6,wob=Math.sin(t*3+i*.9)*(1.2+i*.12);X.drawImage(RFL,0,y0,128,6,P.x-64+wob,gy+3+y0,128,6)}X.restore()}
function marsh(t){if(Q>=2)return;const c0=cam-60,c1=cam+vw+60;
 /* sheen on wet ground */
 for(const s of SOL){if(!s[3]||s[0]>c1||s[0]+s[2]<c0||(zIdx(s[0]+s[2]/2)!=4&&zIdx(s[0]+s[2]/2)!=12))continue;const z=zIdx(s[0]+s[2]/2),g=X.createLinearGradient(0,s[1],0,s[1]+26);g.addColorStop(0,z==4?'rgba(170,230,215,.34)':'rgba(120,235,230,.3)');g.addColorStop(1,'rgba(170,230,215,0)');X.fillStyle=g;X.fillRect(s[0],s[1],s[2],26);
  X.save();X.globalCompositeOperation='lighter';X.strokeStyle='rgba(230,255,250,.5)';X.lineWidth=1.2;X.beginPath();for(let x=Math.max(s[0],Math.floor(c0/90)*90);x<Math.min(s[0]+s[2],c1);x+=90){const o=Math.sin(t*.8+x*.01)*18,xx=x+40+o;X.moveTo(xx-10,s[1]+7+hash(x)*8);X.lineTo(xx+10,s[1]+7+hash(x)*8)}X.stroke();X.restore()}
 /* marsh pits fill with water */
 const gs=G.filter(g=>g[1]>6000&&g[0]<7500).sort((a,b)=>a[0]-b[0]);
 for(let i=0;i<gs.length-1;i++){const a=gs[i][1],b=gs[i+1][0];if(b<=a||b<c0||a>c1)continue;
  const wp=X.createPattern(A.fx_water_body,'repeat');wp.setTransform(new DOMMatrix().translate(a,GY+6));X.fillStyle=wp;X.beginPath();X.moveTo(a,GY+170);X.lineTo(a,GY+6);
  for(let x=a;x<=b;x+=10)X.lineTo(x,GY+6+Math.sin(t*2.2+x*.08)*1.6);X.lineTo(b,GY+170);X.fill();
  X.save();X.globalCompositeOperation='lighter';X.strokeStyle='rgba(220,255,250,.55)';X.lineWidth=1.6;X.beginPath();for(let x=a;x<=b;x+=10){const y=GY+6+Math.sin(t*2.2+x*.08)*1.6;x==a?X.moveTo(x,y):X.lineTo(x,y)}X.stroke();
  for(let k=0;k<3;k++){const u=((t*.4+k/3)%1);X.globalAlpha=(1-u)*.5;X.beginPath();X.ellipse((a+b)/2+Math.sin(k*5)*(b-a)*.25,GY+8,u*(b-a)*.4,u*4,0,0,7);X.stroke()}X.restore();
  X.save();X.globalAlpha=.3;X.translate(0,0);X.restore()}}

 const pat=X.createPattern(A.fx_caustics,'repeat');pat.setTransform(new DOMMatrix().translate(-cam*.9+Math.sin(t*.5)*30+t*14,t*9).scale(1.4));X.fillStyle=pat;X.globalAlpha=.13*f;X.fillRect(0,oy+GY-70,vw,vh);
 X.globalAlpha=.05*f;X.fillRect(0,0,vw,oy+GY-70);
 const sg=X.createLinearGradient(0,0,0,90);sg.addColorStop(0,'rgba(190,255,245,'+.4*f+')');sg.addColorStop(1,'rgba(190,255,245,0)');X.fillStyle=sg;X.globalAlpha=1;X.beginPath();X.moveTo(0,0);
 for(let x=0;x<=vw+16;x+=16)X.lineTo(x,22+Math.sin(x*.03+t*1.6)*5+Math.sin(x*.07-t*2.3)*3);X.lineTo(vw,0);X.fill();
 X.strokeStyle='rgba(235,255,250,'+.55*f+')';X.lineWidth=2;X.beginPath();for(let x=0;x<=vw+16;x+=16){const y=22+Math.sin(x*.03+t*1.6)*5+Math.sin(x*.07-t*2.3)*3;x?X.lineTo(x,y):X.moveTo(x,y)}X.stroke();X.restore()}
